name: SFS Autonomous Offline REA Agent (zero AI credits)

on:
  pull_request:
    paths:
      - ".github/workflows/sfs-autonomous-rea.yml"
      - "tools/free-agent/offline-controller.mjs"
      - "tools/free-agent/test-offline-controller.mjs"
      - "tools/free-agent/provider-gate.mjs"
      - "tools/free-agent/test-provider-gate.mjs"
      - "config/free-agent-providers.json"
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      task:
        description: "Fixed authorized read-only REA MCP self-check"
        type: choice
        options: [selfcheck]
        default: selfcheck
        required: true

permissions:
  contents: read
  issues: read

concurrency:
  group: sfs-autonomous-rea-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-agent:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'main') ||
      (github.event_name == 'issues' && github.event.sender.login == 'SFS-Labs' && github.event.label.name == 'sfs-rea-auto' && github.event.issue.title == 'REA MCP self-check' && github.event.issue.state == 'open')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout reviewed repository only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22.1"
      - name: Zero-AI-credit policy tests
        shell: bash
        run: |
          node --test tools/free-agent/test-offline-controller.mjs
          node --test tools/free-agent/test-validate-plan.mjs
          node --test tools/free-agent/test-provider-gate.mjs
      - name: Enforce optional-provider isolation before downloads
        shell: bash
        run: node tools/free-agent/provider-gate.mjs
      - name: Install pinned local open-weight inference runtime
        shell: bash
        run: npm install --no-save --no-audit --no-fund @huggingface/transformers@4.3.1
      - name: Install pinned REA MCP server
        shell: bash
        run: bash tools/rea/install.sh core
      - name: Autonomous model decision and real REA MCP tool call
        shell: bash
        env:
          INPUT_TASK: ${{ inputs.task || 'selfcheck' }}
        run: node tools/free-agent/offline-controller.mjs
